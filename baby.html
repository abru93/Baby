<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Arrival Countdown</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,700&family=Quicksand:wght@300;700&family=Montserrat:wght@800&family=Dancing+Script:wght@700&display=swap');

        body {
            background-color: #fdf6f0;
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* The flex wrapper handles the horizontal layout */
        .main-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            gap: 30px;
        }

        /* Styling for the boy/girl images */
        .side-character {
            flex: 0 0 180px; /* Fixed width for images */
            max-width: 220px;
            animation: softFloat 5s ease-in-out infinite;
        }

        .side-character img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
        }

        .side-character.right {
            animation-delay: 0.5s;
        }

        /* The central countdown box */
        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 50px 35px;
            border-radius: 50px;
            text-align: center;
            flex: 1;
            max-width: 500px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            z-index: 10;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-style: italic;
            color: #63352e;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .pregnancy-status {
            display: inline-block;
            padding: 12px 30px;
            margin-bottom: 35px;
            font-size: 1.4rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(-45deg, #a2d2ff, #ffafcc, #bde0fe, #ffc8dd);
            background-size: 400% 400%;
            border-radius: 100px;
            animation: gradientShift 8s ease infinite;
            border: 3px solid white;
        }

        .timer-grid {
            display: flex;
            justify-content: space-around;
            gap: 10px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.5);
            flex: 1;
            padding: 20px 5px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.8);
        }

        .time-box span {
            font-family: 'Montserrat', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            color: #4a2c2a;
            display: block;
        }

        .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            color: #8d5b4c;
            margin-top: 5px;
        }

        .footer-text {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: #d17a5d;
            margin-top: 30px;
        }

        /* Animations */
        @keyframes softFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Mobile adjustments: Stack images below the counter */
        @media (max-width: 850px) {
            .main-wrapper { flex-direction: column; }
            .side-character { flex: 0 0 auto; width: 140px; }
            .side-character.left { order: 2; }
            .side-character.right { order: 3; }
            .container { order: 1; width: 90%; }
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- Left Character -->
    <div class="side-character left">
        <img src="Baby Boy.png" alt="Baby Boy">
    </div>

    <!-- Central Counter -->
    <div class="container">
        <h1>Waiting for our baby...</h1>

        <div class="pregnancy-status" id="statusLine">
            Calculating...
        </div>

        <div class="timer-grid">
            <div class="time-box">
                <span id="days">000</span>
                <div class="label">Days</div>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <div class="label">Hours</div>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <div class="label">Mins</div>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <div class="label">Secs</div>
            </div>
        </div>

        <p class="footer-text" id="footerText">.....until our due date!</p>
    </div>

    <!-- Right Character -->
    <div class="side-character right">
        <img src="Baby Girl.png" alt="Baby Girl">
    </div>
</div>

<script>
    // Config: Start Date & Due Date (excluding end date)
    const startDate = new Date("2025-11-09T00:00:00").getTime();
    const dueDate = new Date("2026-08-10T00:00:00").getTime();

    function updateCountdown() {
        const now = new Date().getTime();
        
        // 1. Progress Logic (Weeks & Days)
        const diffFromStart = now - startDate;
        if (diffFromStart > 0) {
            const totalDaysPregnant = Math.floor(diffFromStart / (1000 * 60 * 60 * 24));
            const weeks = Math.floor(totalDaysPregnant / 7);
            const daysRemainder = totalDaysPregnant % 7;
            document.getElementById("statusLine").innerHTML = `We're ${weeks} weeks & ${daysRemainder} days!`;
        }

        // 2. Countdown Logic
        const timeLeft = dueDate - now;

        if (timeLeft > 0) {
            const d = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
            const h = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((timeLeft % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = d;
            document.getElementById("hours").innerText = h.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = m.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = s.toString().padStart(2, '0');
        } else {
            // Reached due date
            document.getElementById("statusLine").style.display = "none";
            document.querySelector(".timer-grid").innerHTML = "<h2 style='color:#63352e; font-style: italic;'>Welcome Little One!</h2>";
            document.getElementById("footerText").innerText = "The adventure begins!";
        }
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
</script>

</body>
</html>
